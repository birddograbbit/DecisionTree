<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">
    Hybrid Transformer-DecisionTree Trading System
  </text>
  
  <!-- Data Input Layer -->
  <rect x="50" y="70" width="1100" height="80" fill="#E8F4F8" stroke="#4A90E2" stroke-width="2" rx="5"/>
  <text x="600" y="100" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Data Input Layer</text>
  <text x="600" y="130" font-size="14" text-anchor="middle" fill="#666">OHLCV Data, Technical Indicators, Market Features</text>
  
  <!-- Feature Engineering -->
  <rect x="250" y="180" width="300" height="60" fill="#F0F8E8" stroke="#7CB342" stroke-width="2" rx="5"/>
  <text x="400" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Feature Engineering</text>
  <text x="400" y="225" font-size="12" text-anchor="middle" fill="#666">Shared Indicators Pipeline</text>
  
  <!-- Sequence Preparation -->
  <rect x="650" y="180" width="300" height="60" fill="#F0F8E8" stroke="#7CB342" stroke-width="2" rx="5"/>
  <text x="800" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Sequence Preparation</text>
  <text x="800" y="225" font-size="12" text-anchor="middle" fill="#666">Time Series Windows</text>
  
  <!-- Decision Tree Components -->
  <g id="dt-components">
    <!-- Market Regime Classifier -->
    <rect x="50" y="280" width="250" height="80" fill="#FFE8E8" stroke="#E74C3C" stroke-width="2" rx="5"/>
    <text x="175" y="305" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Market Regime Classifier</text>
    <text x="175" y="325" font-size="12" text-anchor="middle" fill="#666">Decision Tree</text>
    <text x="175" y="345" font-size="11" text-anchor="middle" fill="#888">Trending/Ranging/Volatile</text>
    
    <!-- Risk Assessment -->
    <rect x="350" y="280" width="250" height="80" fill="#FFE8E8" stroke="#E74C3C" stroke-width="2" rx="5"/>
    <text x="475" y="305" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Risk Assessment</text>
    <text x="475" y="325" font-size="12" text-anchor="middle" fill="#666">Decision Tree</text>
    <text x="475" y="345" font-size="11" text-anchor="middle" fill="#888">Position Sizing</text>
    
    <!-- Signal Generator -->
    <rect x="50" y="390" width="250" height="80" fill="#FFE8E8" stroke="#E74C3C" stroke-width="2" rx="5"/>
    <text x="175" y="415" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Signal Generator</text>
    <text x="175" y="435" font-size="12" text-anchor="middle" fill="#666">Decision Tree</text>
    <text x="175" y="455" font-size="11" text-anchor="middle" fill="#888">Entry/Exit Rules</text>
  </g>
  
  <!-- Transformer Components -->
  <g id="transformer-components">
    <!-- Price Predictor -->
    <rect x="650" y="280" width="300" height="80" fill="#E8E8FF" stroke="#5C6BC0" stroke-width="2" rx="5"/>
    <text x="800" y="305" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Price Predictor</text>
    <text x="800" y="325" font-size="12" text-anchor="middle" fill="#666">Transformer Network</text>
    <text x="800" y="345" font-size="11" text-anchor="middle" fill="#888">Multi-Head Attention</text>
    
    <!-- Pattern Recognition -->
    <rect x="650" y="390" width="300" height="80" fill="#E8E8FF" stroke="#5C6BC0" stroke-width="2" rx="5"/>
    <text x="800" y="415" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Pattern Recognition</text>
    <text x="800" y="435" font-size="12" text-anchor="middle" fill="#666">Sequence Modeling</text>
    <text x="800" y="455" font-size="11" text-anchor="middle" fill="#888">Temporal Dependencies</text>
  </g>
  
  <!-- Ensemble Layer -->
  <rect x="200" y="510" width="600" height="80" fill="#FFF8E8" stroke="#FFA726" stroke-width="3" rx="5"/>
  <text x="500" y="535" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Ensemble Integration Layer</text>
  <text x="500" y="560" font-size="14" text-anchor="middle" fill="#666">Dynamic Weight Adjustment Based on Market Regime</text>
  <text x="500" y="580" font-size="12" text-anchor="middle" fill="#888">Confidence-Based Prediction Fusion</text>
  
  <!-- Meta Learning -->
  <rect x="850" y="510" width="200" height="80" fill="#F3E5F5" stroke="#AB47BC" stroke-width="2" rx="5"/>
  <text x="950" y="535" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Meta Learning</text>
  <text x="950" y="555" font-size="12" text-anchor="middle" fill="#666">Model Selection</text>
  <text x="950" y="575" font-size="11" text-anchor="middle" fill="#888">Performance Tracking</text>
  
  <!-- Trading Decision -->
  <rect x="300" y="630" width="400" height="80" fill="#E8F5E9" stroke="#4CAF50" stroke-width="3" rx="5"/>
  <text x="500" y="660" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Trading Decision</text>
  <text x="500" y="685" font-size="14" text-anchor="middle" fill="#666">Buy / Sell / Hold + Position Size</text>
  
  <!-- Feedback Loop -->
  <rect x="750" y="630" width="200" height="80" fill="#EFEBE9" stroke="#8D6E63" stroke-width="2" rx="5"/>
  <text x="850" y="655" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Performance Feedback</text>
  <text x="850" y="675" font-size="12" text-anchor="middle" fill="#666">Model Updates</text>
  <text x="850" y="695" font-size="11" text-anchor="middle" fill="#888">Online Learning</text>
  
  <!-- Arrows and Connections -->
  <!-- Data flow arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- From Data to Feature Engineering -->
  <line x1="400" y1="150" x2="400" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- From Data to Sequence Prep -->
  <line x1="800" y1="150" x2="800" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- From Feature Engineering to DT components -->
  <line x1="400" y1="240" x2="175" y2="280" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="240" x2="475" y2="280" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="175" y1="360" x2="175" y2="390" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- From Sequence Prep to Transformer -->
  <line x1="800" y1="240" x2="800" y2="280" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="800" y1="360" x2="800" y2="390" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- To Ensemble Layer -->
  <line x1="175" y1="470" x2="300" y2="510" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="475" y1="360" x2="500" y2="510" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="800" y1="470" x2="700" y2="510" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- From Ensemble to Trading Decision -->
  <line x1="500" y1="590" x2="500" y2="630" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- From Meta Learning to Ensemble -->
  <line x1="850" y1="550" x2="800" y2="550" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Feedback Loop -->
  <path d="M 750 670 Q 600 750 400 750 Q 100 750 100 550 Q 100 400 175 360" 
        stroke="#8D6E63" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  
  <!-- Key Benefits Annotations -->
  <g id="annotations">
    <rect x="1000" y="280" width="180" height="60" fill="#FFFDE7" stroke="#F9A825" stroke-width="1" rx="3"/>
    <text x="1090" y="300" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">Transformer Benefits</text>
    <text x="1090" y="315" font-size="10" text-anchor="middle" fill="#666">• Complex patterns</text>
    <text x="1090" y="330" font-size="10" text-anchor="middle" fill="#666">• Long-range deps</text>
    
    <rect x="1000" y="360" width="180" height="60" fill="#FFFDE7" stroke="#F9A825" stroke-width="1" rx="3"/>
    <text x="1090" y="380" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">Decision Tree Benefits</text>
    <text x="1090" y="395" font-size="10" text-anchor="middle" fill="#666">• Interpretability</text>
    <text x="1090" y="410" font-size="10" text-anchor="middle" fill="#666">• Rule extraction</text>
  </g>
</svg>